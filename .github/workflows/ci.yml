name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Verify generated schemas are current
        run: |
          pnpm generate:schemas
          git diff --exit-code -- packages/contracts/generated/json-schema

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Desktop frontend build
        run: pnpm --filter @dokeza/desktop build

      - name: Desktop release configuration
        run: pnpm desktop:release:check

      - name: Dependency audit
        run: pnpm security:audit

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: dokeza
          POSTGRES_PASSWORD: dokeza_local
          POSTGRES_DB: dokeza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokeza -d dokeza"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dokeza:dokeza_local@127.0.0.1:5432/dokeza
      DOKEZA_PG_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages for integration imports
        run: pnpm build

      - name: Apply database migrations
        env:
          PGPASSWORD: dokeza_local
        run: |
          for migration in infra/db/migrations/*.sql; do
            psql -h 127.0.0.1 -U dokeza -d dokeza -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Realtime PostgreSQL integration
        run: pnpm --filter @dokeza/realtime exec vitest run src/postgres-persistence.integration.test.ts

      - name: API meeting review PostgreSQL integration
        run: pnpm --filter @dokeza/api exec vitest run src/meeting-review-postgres.integration.test.ts

      - name: Knowledge PostgreSQL integration
        run: pnpm --filter @dokeza/knowledge exec vitest run src/postgres.integration.test.ts

  desktop-native:
    name: Desktop native smoke
    runs-on: windows-2025
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop frontend build
        run: pnpm --filter @dokeza/desktop build

      - name: Rust format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Rust clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Tauri smoke build
        run: pnpm --filter @dokeza/desktop tauri build --debug --no-bundle

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.6

      - name: Terraform format
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact

      - name: Filesystem vulnerability scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy:0.71.0 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 /repo
